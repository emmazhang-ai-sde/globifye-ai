<script data-purpose="persona-interaction-and-state">
  // Default user state (used when no saved state exists)
  const DEFAULT_USER_STATE = {
    name: "Hunter L.",
    email: "hunter@globifye.com",
    role: "Enterprise AE",
    company: "GlobiFYE",
    tier: "starter"
  };

  // Shared state management object across all onboarding pages (mirroring landing page)
  const appState = {
    selectedPersona: null,
     user: { ...DEFAULT_USER_STATE },
    onboarding: {
      firstName: "",
      lastName: "",
      password: "",
      teamSize: "",
      industry: "",
      specializations: [],
      phoneNumber: "",
      integrations: [],
      microphone: "",
      speaker: ""
    }
  };

  // Load state from localStorage (reuses existing 'dialforgeState' key)
  function loadState() {
    try {
      const saved = localStorage.getItem('dialforgeState');
      console.log('Loaded state from localStorage:', saved);
      if (saved) {
        const state = JSON.parse(saved);
        appState.selectedPersona = state.selectedPersona || null;
        // Merge saved user data if it exists
        if (state.user) {
          appState.user = { ...appState.user, ...state.user };
        }
        // Merge saved onboarding data if it exists
        if (state.onboarding) {
          appState.onboarding = { ...appState.onboarding, ...state.onboarding };
        }
      }
    } catch (e) {
      console.log('Could not load state:', e);
    }
  }

  // Save state to localStorage (extends existing 'dialforgeState' key)
  function saveState() {
    try {
      localStorage.setItem('dialforgeState', JSON.stringify(appState));
    } catch (e) {
      console.log('Could not save state:', e);
    }
  }

  // Select persona from card
    function selectPersona(event, type) {
      event.preventDefault();
      const cards = document.querySelectorAll('.persona-card');
      
      // Visual feedback for selection
        cards.forEach(card => {
          card.classList.remove('selected');
        });
      
      
      const selectedCard = event.currentTarget;
      selectedCard.classList.add('selected');

      // Update state
    appState.selectedPersona = type;
    saveState();

      // selectedCard.style.opacity = '1';
      // selectedCard.style.filter = 'none';
      // selectedCard.style.transform = 'scale(1.05) translateY(-12px)';
      // selectedCard.classList.add('ring-2', 'ring-offset-4', 'ring-offset-background');

      // // Dynamic ring color
      // if(type === 'sales') selectedCard.classList.add('ring-fire-accent');
      // if(type === 'support') selectedCard.classList.add('ring-secondary-container');
      // if(type === 'solo') selectedCard.classList.add('ring-tertiary');

      console.log('Selected Persona:', type);
      
      // Navigate to next step after selection animation
    setTimeout(() => {
      window.location.href = 'OnboardingStep2.html';
    }, 600);
    }

    // Glass reflection mouse tracking
    document.addEventListener('mousemove', (e) => {
      const cards = document.querySelectorAll('.liquid-glass');
      const x = e.clientX / window.innerWidth;
      const y = e.clientY / window.innerHeight;
      
      cards.forEach(card => {
        card.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(255,255,255,0.05) 0%, rgba(30, 31, 39, 0.78) 100%)`;
      });
    });
    // Initialize: Load state and preselect persona if available
  function initializePersonaSelection() {
    loadState();
    
    if (appState.selectedPersona) {
      // Find and select the preselected persona card
      const preselectedCard = document.querySelector(`[data-persona="${appState.selectedPersona}"]`);
      if (preselectedCard) {
        preselectedCard.classList.add('selected');
        console.log('Preselected persona from state:', appState.selectedPersona);
      }
    }
  }

  // Run initialization when DOM is ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializePersonaSelection);
  } else {
    initializePersonaSelection();
  }
  </script>
