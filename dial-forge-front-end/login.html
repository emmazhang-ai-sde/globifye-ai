<script id="tailwind-config">

<style data-purpose="custom-effects">
    body {
      background-color: #0d0e15;
      overflow-x: hidden;
    }

    /* Glassmorphism Effect */
    .liquid-glass {
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Dot Grid Background */
    .dot-grid {
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Animated Mesh Gradients */
    .mesh-gradient {
      background: radial-gradient(at 0% 0%, rgba(255, 122, 28, 0.12) 0px, transparent 50%),
                  radial-gradient(at 100% 100%, rgba(155, 109, 255, 0.1) 0px, transparent 50%),
                  radial-gradient(at 100% 0%, rgba(255, 34, 0, 0.05) 0px, transparent 50%);
    }

    /* Floating Orbs */
    .floating-orb {
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      z-index: -1;
      pointer-events: none;
    }

    /* Button Shimmer Effect */
    .shimmer-btn {
      position: relative;
      overflow: hidden;
    }
    .shimmer-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: rotate(45deg);
      transition: 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .shimmer-btn:hover::after {
      left: 120%;
    }

    /* Custom Focus States */
    input:focus {
      outline: none;
      border-color: #FF7A1C !important;
      box-shadow: 0 0 0 2px rgba(255, 122, 28, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center font-dm-sans text-on-surface antialiased p-4">

<!-- BEGIN: Interactivity Script -->
<script data-purpose="interactive-animations">
    // Subtle mouse parallax for background orbs
    document.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth) - 0.5;
      const y = (e.clientY / window.innerHeight) - 0.5;
      
      const orangeOrb = document.getElementById('orb-orange');
      const purpleOrb = document.getElementById('orb-purple');
      
      orangeOrb.style.transform = `translate(${x * 50}px, ${y * 50}px)`;
      purpleOrb.style.transform = `translate(${x * -30}px, ${y * -30}px)`;
    });

    // Form Handling Simulation
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const submitBtn = loginForm.querySelector('button[type="submit"]');
      const originalContent = submitBtn.innerHTML;
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-sm">sync</span>
        Authenticating...
      `;
      
      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalContent;
      }, 2000);
    });
  </script>
<!-- END: Interactivity Script -->

<script data-purpose="persona-state-management">
  // State management object
  const appState = {
    selectedPersona: null,
    tempPersona: null
  };

  // Load state from localStorage if available
  function loadState() {
    try {
      const saved = localStorage.getItem('dialforgeState');
      if (saved) {
        const state = JSON.parse(saved);
        appState.selectedPersona = state.selectedPersona || null;
      }
    } catch (e) {
      console.log('Could not load state:', e);
    }
  }

  // Save state to localStorage
  function saveState() {
    try {
      localStorage.setItem('dialforgeState', JSON.stringify({
        selectedPersona: appState.selectedPersona
      }));
    } catch (e) {
      console.log('Could not save state:', e);
    }
  }

  // Select persona from persona card and navigate to onboarding
  function selectPersonaAndNavigate(persona, url) {
    appState.selectedPersona = persona;
    appState.tempPersona = null;
    saveState();
    window.location.href = url;
  }

  // Navigate to onboarding without selecting a persona (CTA buttons)
  function clearPersonaAndNavigate(url) {
    appState.selectedPersona = null;
    appState.tempPersona = null;
    try {
      localStorage.setItem('dialforgeState', JSON.stringify({
        selectedPersona: null
      }));
    } catch (e) {
      console.log('Could not clear state:', e);
    }
    window.location.href = url;
  }

  // Initialize state on page load
  loadState();
</script>
