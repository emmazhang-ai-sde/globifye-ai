      logo: "https://lh3.googleusercontent.com/aida-public/AB6AXuDHNoU_UYJGFIp5qIQBr37xKaLJOvStYuBt6b_RC_VOwiacJVeA-fToM512Jits_6LSU34g9d4Pmt0XKLWR2Zq04oPCFy8IZGWxYBOAzZh7jP_bWQ-mjsmdFDFjJFf3ouq8XxmGLGJgZN7n1EiG67ONrnbGxXBjTexx4T3uSPS6ljv6m3I-GhU2WhuF-mf_Yq4n_6EG_x3wrcqu_XT5mK2fK-PsFJpyvT4pWFVc1LXm_QZpLwtownqn39gpQnddtogwWAZ4rVY5XHE" },
    { id: "d11", name: "Rachel Kim",      company: "Snowflake Data",   value: 160000, winProb: 90, stage: "closing", logo: null },
  ];

  let deals = [];
  let draggingDealId = null;

  // ---------- Persistence ----------
  function loadDeals() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      deals = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED_DEALS));
    } catch (e) {
      deals = JSON.parse(JSON.stringify(SEED_DEALS));
    }
  }

  function saveDeals() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(deals));
  }

  // ---------- Formatting helpers ----------
  function fmtCurrency(v) {
    return "$" + Number(v || 0).toLocaleString("en-US");
  }

  function fmtK(v) {
    const n = Number(v || 0);
    if (n >= 1000) return "$" + (n / 1000).toFixed(1) + "k";
    return "$" + n;
  }

  function initials(company) {
    if (!company) return "??";
    const parts = company.replace(/[.,]/g, "").trim().split(/\s+/);
    return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase();
  }

  function avatarColor(id) {
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) >>> 0;
    return AVATAR_PALETTE[hash % AVATAR_PALETTE.length];
  }

  // ---------- Rendering ----------
  function cardHTML(deal, col) {
    const logoInner = deal.logo
      ? `<img alt="${escapeHtml(deal.company)}" src="${deal.logo}" class="w-full h-full object-contain">`
      : `<div class="w-full h-full rounded-lg ${avatarColor(deal.id)} flex items-center justify-center text-[10px] font-extrabold text-background">${initials(deal.company)}</div>`;

    return `
      <div class="glass-card p-4 rounded-2xl group cursor-pointer hover:border-${col.accent}/30 transition-all"
           draggable="true"
           data-deal-id="${deal.id}"
           ondragstart="handleDragStart(event, '${deal.id}')"
           ondragend="handleDragEnd(event)"
           onclick="handleCardClick(event, '${deal.id}')">
        <div class="flex justify-between items-start mb-4">
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-white rounded-lg flex items-center justify-center p-1 overflow-hidden">
              ${logoInner}
            </div>
            <div>
              <h4 class="text-sm font-bold group-hover:text-${col.accent} transition-colors">${escapeHtml(deal.name)}</h4>
              <p class="text-[11px] text-on-surface/40">${escapeHtml(deal.company)}</p>
            </div>
          </div>
          <span class="material-symbols-outlined text-on-surface/20 hover:text-on-surface">more_vert</span>
        </div>
        <div class="flex justify-between items-end mb-2">
          <div>
            <p class="text-[10px] font-bold text-on-surface/30 uppercase tracking-tighter">Deal Value</p>
            <p class="text-2xl font-extrabold font-syne">${fmtCurrency(deal.value)}</p>
          </div>
          <span class="text-[10px] font-bold ${col.text} pb-1">${deal.winProb}% Win Prob.</span>
        </div>
        <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
          <div class="h-full ${col.bar}" style="width:${Math.max(0, Math.min(100, deal.winProb))}%"></div>
        </div>
      </div>`;
  }

  function columnHTML(col) {
    const colDeals = deals.filter((d) => d.stage === col.key);
    const total = colDeals.reduce((sum, d) => sum + Number(d.value || 0), 0);
    const countLabel = String(colDeals.length).padStart(2, "0");
    const cards = colDeals.map((d) => cardHTML(d, col)).join("");

    return `
      <div class="kanban-column flex flex-col">
        <div class="flex items-center justify-between mb-4 px-1">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full ${col.dot}"></div>
            <span class="uppercase text-[11px] font-bold tracking-widest text-on-surface/60">${col.label}</span>
            <span class="bg-white/5 px-2 py-0.5 rounded text-[10px] text-on-surface/80">${countLabel}</span>
          </div>
          <span class="text-[11px] font-mono-data text-on-surface/40">${fmtK(total)}</span>
        </div>
        <div id="column-${col.key}"
             class="flex flex-col gap-4 overflow-y-auto scrollbar-hide flex-1 min-h-[80px] rounded-2xl transition-colors p-1 -m-1"
             ondragover="handleDragOver(event)"
             ondragleave="handleDragLeave(event)"
             ondrop="handleDrop(event, '${col.key}')">
          ${cards || `<div class="text-[11px] text-on-surface/20 text-center py-6 border border-dashed border-white/10 rounded-xl">Drop deals here</div>`}
        </div>
      </div>`;
  }

  function renderPipeline() {
    const scroller = document.getElementById("kanban-scroller");
    scroller.innerHTML = PIPELINE_COLUMNS.map(columnHTML).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  // ---------- Drag and drop ----------
  function handleDragStart(evt, dealId) {
    draggingDealId = dealId;
    evt.dataTransfer.setData("text/plain", dealId);
    evt.dataTransfer.effectAllowed = "move";
    evt.currentTarget.classList.add("opacity-40");
  }

  function handleDragEnd(evt) {
    evt.currentTarget.classList.remove("opacity-40");
    draggingDealId = null;
    document.querySelectorAll("[id^='column-']").forEach((col) => col.classList.remove("ring-2", "ring-fire-accent/50", "bg-white/[0.03]"));
  }

  function handleDragOver(evt) {
    evt.preventDefault();
    evt.dataTransfer.dropEffect = "move";
    evt.currentTarget.classList.add("ring-2", "ring-fire-accent/50", "bg-white/[0.03]");
  }

  function handleDragLeave(evt) {
    evt.currentTarget.classList.remove("ring-2", "ring-fire-accent/50", "bg-white/[0.03]");
  }

  function handleDrop(evt, stageKey) {
    evt.preventDefault();
    evt.currentTarget.classList.remove("ring-2", "ring-fire-accent/50", "bg-white/[0.03]");
    const dealId = evt.dataTransfer.getData("text/plain") || draggingDealId;
    const deal = deals.find((d) => d.id === dealId);
    if (!deal) return;
    if (deal.stage !== stageKey) {
      deal.stage = stageKey;
      saveDeals();
    }
    renderPipeline();
  }

  // ---------- Card click -> edit modal ----------
  function handleCardClick(evt, dealId) {
    openDealModal(dealId);
  }

  // ---------- Modal logic ----------
  function openDealModal(dealId) {
    const overlay = document.getElementById("dealModalOverlay");
    const title = document.getElementById("dealModalTitle");
    const deleteBtn = document.getElementById("modalDeleteBtn");
    const errorEl = document.getElementById("modalError");
    errorEl.classList.add("hidden");

    if (dealId) {
      const deal = deals.find((d) => d.id === dealId);
      if (!deal) return;
      overlay.dataset.editingId = dealId;
      title.textContent = "Edit Deal";
      document.getElementById("modalContactName").value = deal.name;
      document.getElementById("modalCompany").value = deal.company;
      document.getElementById("modalValue").value = deal.value;
      document.getElementById("modalWinProb").value = deal.winProb;
      document.getElementById("modalStage").value = deal.stage;
      deleteBtn.classList.remove("hidden");
    } else {
      overlay.dataset.editingId = "";
      title.textContent = "New Deal";
      document.getElementById("modalContactName").value = "";
      document.getElementById("modalCompany").value = "";
      document.getElementById("modalValue").value = "";
      document.getElementById("modalWinProb").value = "25";
      document.getElementById("modalStage").value = "prospect";
      deleteBtn.classList.add("hidden");
    }

    overlay.classList.remove("hidden");
    overlay.classList.add("flex");
  }

  function closeDealModal() {
    const overlay = document.getElementById("dealModalOverlay");
    overlay.classList.add("hidden");
    overlay.classList.remove("flex");
  }

  function saveDealFromModal() {
    const overlay = document.getElementById("dealModalOverlay");
    const errorEl = document.getElementById("modalError");
    const name = document.getElementById("modalContactName").value.trim();
    const company = document.getElementById("modalCompany").value.trim();
    const value = Number(document.getElementById("modalValue").value);
    const winProb = Number(document.getElementById("modalWinProb").value);
    const stage = document.getElementById("modalStage").value;

    if (!name || !company || !value || value <= 0) {
      errorEl.textContent = "Please fill in contact name, company, and a deal value greater than 0.";
      errorEl.classList.remove("hidden");
      return;
    }

    const clampedWinProb = Math.max(0, Math.min(100, isNaN(winProb) ? 0 : winProb));
    const editingId = overlay.dataset.editingId;

    if (editingId) {
      const deal = deals.find((d) => d.id === editingId);
      if (deal) {
        deal.name = name;
        deal.company = company;
        deal.value = value;
        deal.winProb = clampedWinProb;
        deal.stage = stage;
      }
    } else {
      deals.push({
        id: "d" + Date.now(),
        name,
        company,
        value,
        winProb: clampedWinProb,
        stage,
        logo: null,
      });
    }

    saveDeals();
    renderPipeline();
    closeDealModal();
  }

  function deleteDealFromModal() {
    const overlay = document.getElementById("dealModalOverlay");
    const editingId = overlay.dataset.editingId;
    if (!editingId) return;
    deals = deals.filter((d) => d.id !== editingId);
    saveDeals();
    renderPipeline();
    closeDealModal();
  }

  // Close modal on overlay click (but not when clicking the panel itself)
  document.addEventListener("DOMContentLoaded", () => {
    const overlay = document.getElementById("dealModalOverlay");
    overlay.addEventListener("click", (evt) => {
      if (evt.target === overlay) closeDealModal();
    });

    loadDeals();
    renderPipeline();
  });
</script>
<script data-purpose="scrolling-interactivity">
  // Horizontal scroll with mouse wheel for the kanban board
  const scrollContainer = document.getElementById('kanban-scroller');
  scrollContainer.addEventListener('wheel', (evt) => {
    evt.preventDefault();
    scrollContainer.scrollLeft += evt.deltaY;
  });
</script>
</body></html>
