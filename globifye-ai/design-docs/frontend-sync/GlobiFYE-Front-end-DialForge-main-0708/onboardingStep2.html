<style data-purpose="layout-effects">
    body {
      background: radial-gradient(circle at 50% 0%, #1a1b23 0%, #12131a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    }

    .liquid-glass {
      background: rgba(26, 27, 35, 0.78);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    }

    .fire-gradient-btn {
      background: linear-gradient(135deg, #FF7A1C 0%, #FF562A 100%);
      box-shadow: 0 0 20px rgba(255, 122, 28, 0.3), 0 0 40px rgba(255, 86, 42, 0.1);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fire-gradient-btn:hover {
      filter: saturate(1.2) brightness(1.1);
      transform: translateY(-2px);
    }

    .noise-overlay {
      position: fixed;
      inset: 0;
      background: url("https://grainy-gradients.vercel.app/noise.svg");
      opacity: 0.03;
      pointer-events: none;
      z-index: 999;
    }

    .specular-highlight {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }

    .strength-segment {
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      transition: all 0.4s ease;
    }

    .active-orb {
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>

<!-- BEGIN: Logic & Interaction -->
<script data-purpose="password-logic">
    const passwordInput = document.getElementById('password');
    const segments = document.querySelectorAll('.strength-segment');

    passwordInput.addEventListener('input', (e) => {
      const val = e.target.value;
      const length = val.length;
      
      segments.forEach((seg, index) => {
        if (length > (index * 3)) {
          seg.style.backgroundColor = getStrengthColor(index);
          seg.style.boxShadow = `0 0 10px ${getStrengthColor(index)}66`; // 40% opacity
        } else {
          seg.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
          seg.style.boxShadow = 'none';
        }
      });
    });

    function getStrengthColor(index) {
      const colors = ['#FF3B30', '#FFAD1C', '#F5C518', '#00e478'];
      return colors[index];
    }
  </script>
<script data-purpose="form-submission">
    document.getElementById('registration-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalContent = submitBtn.innerHTML;
      
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
        Processing...
      `;
      submitBtn.style.pointerEvents = 'none';
      submitBtn.style.opacity = '0.7';

      setTimeout(() => {
        submitBtn.innerHTML = originalContent;
        submitBtn.style.pointerEvents = 'auto';
        submitBtn.style.opacity = '1';
        alert('Validation complete. Moving to Step 2...');
      }, 1500);
    });
  </script>
<!-- END: Logic & Interaction -->
