<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer phone — GlobiFYE Voice Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="phone-app">

    <header class="topbar">
      <span class="brand-lamp"></span>
      <span class="brand-name">GlobiFYE Voice Agent</span>
      <span class="eyebrow">customer phone</span>
      <span class="spacer"></span>
      <a class="btn-quiet" href="/sales.html" target="_blank" rel="noopener">Sales view ↗</a>
      <button class="btn-quiet" id="logout">Sign out</button>
    </header>

    <div class="phone-stage">
      <div class="phone">
        <div class="phone-notch"></div>

        <!-- idle -->
        <div class="phone-view" id="view-idle">
          <div class="contact-avatar" id="avatar">•</div>
          <div class="contact-name" id="contact-name">Business</div>
          <div class="contact-sub">Tap to call</div>
          <button class="phone-call-btn" id="call-business" aria-label="Call the business">
            <svg width="28" height="28" viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9 3 3.4 3.4 3 4 3h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
          </button>
        </div>

        <!-- outgoing: calling -->
        <div class="phone-view" id="view-calling" hidden>
          <div class="contact-avatar pulse" id="avatar-calling">•</div>
          <div class="contact-name" id="calling-name">Business</div>
          <div class="contact-sub calling-sub">Calling…</div>
          <button class="phone-end-btn" id="calling-end" aria-label="Cancel call">
            <svg width="26" height="26" viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9 3 3.4 3.4 3 4 3h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
          </button>
        </div>

        <!-- incoming ring -->
        <div class="phone-view" id="view-incoming" hidden>
          <div class="contact-avatar pulse" id="avatar-incoming">•</div>
          <div class="contact-name" id="incoming-name">Business</div>
          <div class="contact-sub">Incoming call…</div>
          <div class="incoming-actions">
            <button class="phone-decline" id="incoming-decline" aria-label="Decline">
              <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9 3 3.4 3.4 3 4 3h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
            </button>
            <button class="phone-accept" id="incoming-accept" aria-label="Accept">
              <svg width="24" height="24" viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.2.4 2.4.6 3.7.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.9 21 3 13.1 3 3.9 3 3.4 3.4 3 4 3h3.5c.6 0 1 .4 1 1 0 1.2.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.3 2.2z"/></svg>
            </button>
          </div>
          <p class="phone-hint">Answer the softphone to talk.</p>
        </div>

        <!-- active call -->
        <div class="phone-view active" id="view-active" hidden>
          <div class="active-head">
            <span class="active-name" id="active-name">Business</span>
            <span class="active-timer" id="active-timer">00:00</span>
          </div>
          <div class="phone-transcript" id="phone-transcript">
            <p class="phone-transcript-empty">Say hello — the conversation will appear here.</p>
          </div>
          <button class="phone-end-btn wide" id="active-end">End call</button>
        </div>

      </div>
    </div>
  </div>

  <script src="/client.js"></script>
</body>
</html>
